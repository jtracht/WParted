# SPDX-License-Identifier: GPL-2.0-or-later
# Builds a release for a version tag (v0.1.0-alpha, v1.0.0, ...) on the
# Linux runner and creates a *draft* Gitea release. A maintainer publishes it
# after the manual real-Windows smoke test (Wine is not Windows).
# Fails without creating a release if any step or artefact is missing.
# Token: secret RELEASE_TOKEN if visible to this repository, otherwise the
# automatic job token (sufficient to create releases in this repository).
# Note: organisation secrets are not visible to this user-owned repository.
# Optional secrets: SIGNING_CERT_PFX_BASE64, SIGNING_CERT_PASSWORD (Authenticode via osslsigncode).
name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          suffix="$(sed -n 's/.*WPARTED_VERSION_SUFFIX "\([^"]*\)".*/\1/p' CMakeLists.txt | head -1)"
          [ -n "$suffix" ] && ver="$ver-$suffix"
          [ "$tag" = "$ver" ] || { echo "tag $tag does not match CMake version $ver"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Build, test and package x64
        run: bash tools/ci/build-mingw.sh x64 --package
      - name: Build, test and package x86
        run: bash tools/ci/build-mingw.sh x86 --package --no-deps
      - name: GUI smoke test (Wine)
        run: bash tools/ci/gui-smoke-wine.sh build/mingw-x64/apps/wparted-gui/wparted.exe

      - name: Sign binaries (skipped and reported as unsigned without secrets)
        env:
          PFX_B64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: bash tools/sign-release.sh dist

      - name: Source archive, SBOM, checksums, completeness
        run: |
          v="$VERSION"
          git archive --format=zip --prefix="WParted-v$v/" -o "dist/WParted-v$v-source.zip" HEAD
          python3 tools/generate_sbom.py "$v" "dist/WParted-v$v-sbom.json" dist/*.zip
          sum="dist/WParted-v$v-checksums.sha256"
          rm -f "$sum"
          (cd dist && sha256sum $(ls | grep -v checksums.sha256)) > "$sum"
          for f in "WParted-v$v-win7plus-x64-portable.zip" "WParted-v$v-win7plus-x86-portable.zip" \
                   "WParted-v$v-source.zip" "WParted-v$v-sbom.json" "WParted-v$v-checksums.sha256"; do
            [ -s "dist/$f" ] || { echo "missing artefact $f"; exit 1; }
          done

      # Same files as an Actions artefact (v4 protocol): downloadable through the
      # authenticated API for the manual real-Windows gate (the instance requires
      # sign-in for release downloads, also for drafts).
      - name: Upload release files as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*

      - name: Create draft Gitea release and upload artefacts
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          v="$VERSION"
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          prerelease=false; case "$v" in *-*) prerelease=true ;; esac
          python3 tools/release_notes.py "$v" > notes.md
          body="$(python3 -c 'import json,sys;print(json.dumps({"tag_name":"v"+sys.argv[1],"name":"WParted v"+sys.argv[1],"body":open("notes.md").read(),"draft":True,"prerelease":sys.argv[2]=="true"}))' "$v" "$prerelease")"
          id="$(curl --fail -sS -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d "$body" "$api/releases" | python3 -c 'import json,sys;print(json.load(sys.stdin)["id"])')"
          for f in dist/*; do
            [ -f "$f" ] || continue
            curl --fail -sS -H "Authorization: token $TOKEN" -F "attachment=@$f" "$api/releases/$id/assets?name=$(basename "$f")" >/dev/null \
              || { echo "upload failed: $f (release stays a draft)"; exit 1; }
          done
          echo "Draft release $id created. Publish it after the manual Windows smoke test."
