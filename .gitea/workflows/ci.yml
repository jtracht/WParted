# SPDX-License-Identifier: GPL-2.0-or-later
# Pull request / push validation on the instance's only runner
# (label ubuntu-latest, image docker.gitea.com/runner-images:ubuntu-latest).
# Windows binaries are cross-compiled with MinGW-w64 and tested under Wine;
# real-Windows verification is a manual release gate (docs/developer/release-process.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only guard (no write paths in v0.x read-only builds)
        run: python3 tools/ci/check_readonly.py
      - name: SPDX headers
        run: python3 tools/ci/check_spdx.py
      - name: Secrets scan (simple patterns)
        run: |
          if grep -rInE '(gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})' \
               --exclude-dir=.git --exclude-dir=build . ; then
            echo "possible secret committed"; exit 1; fi
      - name: Markdown relative links
        run: python3 tools/ci/check_links.py
      - name: Website (build EN/DE, SEO/structure check)
        run: |
          python3 tools/website/build.py --out build/site-check --base-url https://site.invalid/
          python3 tools/website/check.py build/site-check --expect-base
          python3 tools/website/build.py --out build/site
          python3 tools/website/check.py build/site
      - name: Upload website
        uses: actions/upload-artifact@v3
        with:
          name: wparted-website
          path: build/site

  core-linux:
    name: core + unit tests (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake ninja-build g++ >/dev/null
      - name: Configure
        run: cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DWPARTED_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/linux
      - name: Test
        run: ctest --test-dir build/linux --output-on-failure
      - name: Detection against real mkfs images (ext2/3/4, FAT16/32, exFAT, NTFS, btrfs, XFS, F2FS, swap)
        run: |
          apt-get install -y -qq --no-install-recommends \
            e2fsprogs dosfstools exfatprogs ntfs-3g btrfs-progs xfsprogs f2fs-tools util-linux >/dev/null
          bash tools/ci/mkfs-fixtures.sh build/linux/tests/wparted_detect_fs
      - name: Plan execution on image files, checked with sgdisk, sfdisk, e2fsck and debugfs
        run: |
          apt-get install -y -qq --no-install-recommends gdisk fdisk mtools >/dev/null
          bash tools/ci/image-apply-check.sh build/linux/tests/wparted_image_tool
      - name: File-system operations checked with dosfstools, mtools, exfatprogs, ntfs-3g, e2fsprogs
        run: |
          apt-get install -y -qq --no-install-recommends mtools >/dev/null
          bash tools/ci/fs-tools-check.sh build/linux/tests/wparted_image_tool build/linux/tests/wparted_detect_fs

  windows-cross:
    name: Windows ${{ matrix.arch }} (MinGW cross build, tests under Wine)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Build, unit tests, CLI end-to-end test, import check, package
        run: bash tools/ci/build-mingw.sh ${{ matrix.arch }} --package
      - name: GUI start-up smoke test (Wine + Xvfb)
        run: bash tools/ci/gui-smoke-wine.sh build/mingw-${{ matrix.arch }}/apps/wparted-gui/wparted.exe
      - name: Upload portable package
        uses: actions/upload-artifact@v3
        with:
          name: wparted-${{ matrix.arch }}-portable
          path: dist/*.zip
