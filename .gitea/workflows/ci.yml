# SPDX-License-Identifier: GPL-2.0-or-later
# Pull request / push validation on the instance's only runner
# (label ubuntu-latest, image docker.gitea.com/runner-images:ubuntu-latest).
# Windows binaries are cross-compiled with MinGW-w64 and tested under Wine;
# real-Windows verification is a manual release gate (docs/developer/release-process.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read-only guard (no write paths in v0.x read-only builds)
        run: python3 tools/ci/check_readonly.py
      - name: SPDX headers
        run: python3 tools/ci/check_spdx.py
      - name: Secrets scan (simple patterns)
        run: |
          if grep -rInE '(gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|AKIA[0-9A-Z]{16})' \
               --exclude-dir=.git --exclude-dir=build . ; then
            echo "possible secret committed"; exit 1; fi
      - name: Markdown relative links
        run: python3 tools/ci/check_links.py

  core-linux:
    name: core + unit tests (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake ninja-build g++ >/dev/null
      - name: Configure
        run: cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DWPARTED_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/linux
      - name: Test
        run: ctest --test-dir build/linux --output-on-failure

  windows-cross:
    name: Windows ${{ matrix.arch }} (MinGW cross build, tests under Wine)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Build, unit tests, CLI end-to-end test, import check, package
        run: bash tools/ci/build-mingw.sh ${{ matrix.arch }} --package
      - name: GUI start-up smoke test (Wine + Xvfb)
        run: bash tools/ci/gui-smoke-wine.sh build/mingw-${{ matrix.arch }}/apps/wparted-gui/wparted.exe
      - name: Upload portable package
        uses: actions/upload-artifact@v3
        with:
          name: wparted-${{ matrix.arch }}-portable
          path: dist/*.zip
