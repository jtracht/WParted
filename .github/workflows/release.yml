# SPDX-License-Identifier: GPL-2.0-or-later
# Builds a release for a version tag (v0.1.0-alpha, v1.0.0, ...) on a
# GitHub-hosted Ubuntu runner and creates a *draft* GitHub release. A
# maintainer publishes it after the release checks (docs/developer/release-process.md).
# Fails without creating a release if any step or artefact is missing.
# Token: the automatic GITHUB_TOKEN (contents: write).
# Optional secrets: SIGNING_CERT_PFX_BASE64, SIGNING_CERT_PASSWORD (Authenticode via osslsigncode).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          suffix="$(sed -n 's/.*WPARTED_VERSION_SUFFIX "\([^"]*\)".*/\1/p' CMakeLists.txt | head -1)"
          [ -n "$suffix" ] && ver="$ver-$suffix"
          [ "$tag" = "$ver" ] || { echo "tag $tag does not match CMake version $ver"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Build, test and package x64
        run: bash tools/ci/build-mingw.sh x64 --package
      - name: Build, test and package x86
        run: bash tools/ci/build-mingw.sh x86 --package --no-deps
      - name: GUI smoke test (Wine)
        run: bash tools/ci/gui-smoke-wine.sh build/mingw-x64/apps/wparted-gui/wparted.exe

      - name: Sign binaries (skipped and reported as unsigned without secrets)
        env:
          PFX_B64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: bash tools/sign-release.sh dist

      - name: Source archive, SBOM, checksums, completeness
        run: |
          v="$VERSION"
          git archive --format=zip --prefix="WParted-v$v/" -o "dist/WParted-v$v-source.zip" HEAD
          python3 tools/generate_sbom.py "$v" "dist/WParted-v$v-sbom.json" dist/*.zip
          sum="dist/WParted-v$v-checksums.sha256"
          rm -f "$sum"
          (cd dist && sha256sum $(ls | grep -v checksums.sha256)) > "$sum"
          for f in "WParted-v$v-win7plus-x64-portable.zip" "WParted-v$v-win7plus-x86-portable.zip" \
                   "WParted-v$v-source.zip" "WParted-v$v-sbom.json" "WParted-v$v-checksums.sha256"; do
            [ -s "dist/$f" ] || { echo "missing artefact $f"; exit 1; }
          done

      - name: Upload release files as workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*

      - name: Create draft GitHub release with the artefacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$VERSION"
          python3 tools/release_notes.py "$v" > notes.md
          flags="--draft"
          case "$v" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "v$v" dist/* $flags --verify-tag --title "WParted v$v" --notes-file notes.md
          echo "Draft release v$v created. Publish it after the release checks."
